# @dsh-ios/bridge bundle layer: mounts the host bridge plugin, which exposes
# the DSH app's iOS capabilities as dsh tools.
#
# dsh-ios-heal-home lists this bundle in every profile's dsh.profile.bundles
# (web for the app, headless for the tests, and any profile you create with
# `dsh plugin`). The plugin registers nothing when DSH_HOST_BRIDGE_URL/_TOKEN
# are absent, so the same guest image still runs outside the app (CLI
# emulator, tests).
- insert:
    - id: host-bridge
      name: /usr/local/lib/dsh-plugins/dsh-host-bridge/index.js
